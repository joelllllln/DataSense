<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2933">
<title>Codility Trainer</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
:root{
  --bg:#F4F4EF; --card:#FFFFFF; --rule:#DADFE5; --ink:#1F2933; --ink2:#5B6B7B; --ink3:#8A98A6;
  --blue:#2447C5; --blue-soft:#E9EEFC; --red:#D6402B; --red-soft:#FBEFED; --green:#1C7C1C; --green-soft:#EAF5EA;
  --amber:#B26A00; --amber-soft:#FFF4DE; --code:#F7F7F2; --shadow:0 1px 2px rgba(31,41,51,.08),0 4px 14px rgba(31,41,51,.06);
  --c1:#C2410C; --query:#4a3aa7; --pyvar:#0E7C86;
  --mono:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171A; --card:#1E2227; --rule:#343B44; --ink:#E8E6E0; --ink2:#A9B1BB; --ink3:#7C8590;
    --blue:#8CA2F2; --blue-soft:#232A44; --red:#F08672; --red-soft:#3A2320; --green:#77C577; --green-soft:#1F2E1F;
    --amber:#F0B45A; --amber-soft:#3A2F1A; --code:#171A1E; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
    --c1:#F0A070; --query:#B9A9FF; --pyvar:#6FC7CE;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
code,pre,textarea.code{font-family:var(--mono)}
code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.92em}
#app{max-width:860px;margin:0 auto;padding:14px 16px 60px}
.hidden{display:none !important}

.bar{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:10px;flex-wrap:wrap}
.bar h1{font-size:24px;font-weight:700;flex:1;letter-spacing:-.01em}
.bar .title{flex:1;min-width:0}
.bar .title b{display:block;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:13px;color:var(--ink2)}
.back{font-size:16px;color:var(--blue);padding:10px 8px 10px 0;font-weight:500;white-space:nowrap}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:600;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}

.panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:650;margin-bottom:8px}
.panel p{font-size:16px}
.panel p + p{margin-top:8px}
.note{font-size:14px;color:var(--ink2);line-height:1.45}
.idea{border-left:4px solid var(--blue);background:var(--blue-soft)}
.idea h2{color:var(--blue)}
.idea p{font-size:16px}

/* home */
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 18px;background:var(--blue);color:#fff;border-radius:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.cont b{display:block;font-size:17px}
.cont span{font-size:13px;opacity:.85}
.cont .chev{margin-left:auto;font-size:22px}
.topic{display:block;width:100%;text-align:left;padding:14px 0}
.topic + .topic{border-top:1px solid var(--rule)}
.topic .head{display:flex;align-items:center;gap:10px}
.topic .num{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.topic .n{flex:1;min-width:0}
.topic .n b{display:block;font-size:17px;font-weight:600}
.topic .n span{font-size:13px;color:var(--ink2)}
.topic .pct{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0 40px}
.dot{width:26px;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--rule);font-size:11px;color:var(--ink3);display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.dot.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.dot.cur{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.pbar{height:4px;background:var(--rule);border-radius:2px;margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);min-width:100px;flex:1}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}

/* lesson */
.ex{font-family:var(--mono);font-size:14px;background:var(--code);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre}
.ex + .ex{margin-top:6px}
.ex .arrow{color:var(--ink3)}
.sig{font-family:var(--mono);font-size:14px;color:var(--ink2);margin-bottom:6px}
.py-cell{position:relative;border:1.5px solid var(--rule);border-radius:12px;background:var(--code);overflow:hidden}
.py-cell::after{content:'python';position:absolute;top:7px;right:11px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);opacity:.6;pointer-events:none}
.py-cell:focus-within{border-color:var(--blue)}
textarea.code{display:block;width:100%;min-height:220px;padding:12px 14px;font-size:15px;line-height:1.5;background:transparent;border:none;outline:none;resize:vertical;color:var(--ink);tab-size:4;white-space:pre;overflow:auto}
.py-cell-hl{position:absolute;inset:0;margin:0;padding:12px 14px;font-size:15px;line-height:1.5;overflow:hidden;pointer-events:none;white-space:pre;background:transparent}
.py-cell-hl code{font:inherit;background:none;padding:0;white-space:inherit;color:var(--ink)}
.py-cell-ta{position:relative;color:transparent !important;caret-color:var(--ink)}
.py-cell-ta::selection{background:rgba(36,71,197,.25)}
.tok-kw{color:var(--blue);font-weight:600}.tok-str{color:var(--green)}.tok-num{color:var(--c1)}.tok-com{color:var(--ink3);font-style:italic}.tok-fn{color:var(--query)}.tok-var{color:var(--pyvar)}

.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{min-height:46px;border-radius:12px;font-size:15px;font-weight:600;padding:10px 16px;background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--blue);color:#fff}
.btn.good{background:var(--green-soft);color:var(--green)}
.btn.ghost{background:none;box-shadow:none;color:var(--blue);font-weight:500}
.btn.sm{min-height:38px;font-size:14px;padding:8px 12px}
.kbd{font-size:12px;color:var(--ink3);margin-left:auto;align-self:center}

.status{font-size:14px;color:var(--ink2);margin-top:10px;min-height:20px}
.err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin-top:10px}
table.res{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
table.res th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--rule)}
table.res td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top;font-family:var(--mono);font-size:13px;word-break:break-word}
table.res td.s{font-family:inherit;white-space:nowrap;font-weight:600}
tr.pass td.s{color:var(--green)} tr.fail td.s{color:var(--red)} tr.wait td.s{color:var(--ink3)}
td.name{font-family:inherit;color:var(--ink2)}
.stdout{background:var(--code);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;margin-top:10px;max-height:200px;overflow:auto}
.solved{background:var(--green-soft);border-left:4px solid var(--green)}
.solved h2{color:var(--green)}
.hintbox{background:var(--amber-soft);border-left:4px solid var(--amber)}
.hintbox h2{color:var(--amber)}
pre.sol{background:var(--code);border-radius:10px;padding:12px;font-size:14px;overflow-x:auto;margin-top:8px}
.navrow{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.foot{color:var(--ink3);font-size:12px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div id="app"></div>
<script src="harness.js"></script>
<script src="data_iter.js"></script>
<script src="data_arr.js"></script>
<script src="data_count.js"></script>
<script src="data_prefix.js"></script>
<script src="data_sort.js"></script>
<script src="data_stack.js"></script>
<script src="data_window.js"></script>
<script src="data_lead.js"></script>
<script src="app.js"></script>
</body>
</html>
